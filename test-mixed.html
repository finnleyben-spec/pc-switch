<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>MixedContent-Test: laeuft</title>
</head>
<body>
<pre id="out">Test laeuft…</pre>
<script>
const out = document.getElementById("out");
function log(s){ out.textContent += "\n" + s; document.title = "MC-TEST: " + s; }
// 1) ws:// zu lokaler IP (Mixed Content Test)
let ws;
try {
  ws = new WebSocket("ws://192.168.0.205:8123/api/websocket");
  const t = setTimeout(()=>{ log("ws:// lokal: TIMEOUT"); }, 8000);
  ws.onmessage = e => { clearTimeout(t); log("ws:// lokal: OK -> " + e.data.slice(0,60)); };
  ws.onerror = () => { clearTimeout(t); log("ws:// lokal: ERROR (blockiert?)"); };
  ws.onclose = e => { clearTimeout(t); log("ws:// lokal: CLOSED code=" + e.code + " wasClean=" + e.wasClean); };
} catch(e) { log("ws:// lokal: EXCEPTION " + e); }
</script>
</body>
</html>
